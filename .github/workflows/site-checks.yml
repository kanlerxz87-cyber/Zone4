name: Site checks

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rebuild the site from data/
        run: python3 scripts/build_site.py
      - name: Verify data, links, anchors, disclosure, row sources and policy guards
        run: python3 scripts/verify.py
      - name: Confirm committed docs/ matches the build
        # Session branches commit generated pages; some owned by other sessions
        # may still be mid-edit, so the drift check gates the merge target only.
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: git diff --exit-code -- docs
